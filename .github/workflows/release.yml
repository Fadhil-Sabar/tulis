name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Verifikasi tag cocok dengan versionName
        run: grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts
      - name: Siapkan keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ks.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
      - run: ./gradlew testReleaseUnitTest assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Susun rilis
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "tulis-$v.apk"
          sha256sum "tulis-$v.apk" > "tulis-$v.apk.sha256"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" tulis-*.apk tulis-*.apk.sha256 --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
